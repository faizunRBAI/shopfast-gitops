# ---------------------------------------------------------------------------
# ShopFast chart values.
#
# strategy selects EXACTLY ONE delivery mode:
#   standard  -> apps/v1 Deployment
#   bluegreen -> argoproj.io/v1alpha1 Rollout with a blueGreen strategy
#   canary    -> argoproj.io/v1alpha1 Rollout with a weighted canary strategy
#
# Any other value fails template rendering (see templates/_validate.tpl), so a
# typo can never silently deploy the wrong thing.
# ---------------------------------------------------------------------------
strategy: standard

replicaCount: 3

image:
  # These defaults exist so `helm lint`/`helm template` work standalone.
  # The DEPLOYED values live in gitops/applications/shopfast/values.yaml and are
  # rewritten by CI with the ECR registry + immutable Git SHA tag.
  repository: shopfast
  # Must be immutable — "latest" is refused by templates/_validate.tpl.
  tag: "placeholder"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

release:
  # Surfaced by /api/hello and the landing page so you can see which revision
  # served a request during a rollout.
  color: blue

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: alb
  host: shopfast.royalbengal.xyz
  certificateArn: ""
  annotations: {}

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    # CPU limit deliberately omitted: CPU limits throttle JVM warmup.
    memory: 1Gi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 45
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# --- Blue/Green ------------------------------------------------------------
blueGreen:
  # false => a human promotes the new colour explicitly (safe default).
  autoPromotionEnabled: false
  autoPromotionSeconds: 0
  scaleDownDelaySeconds: 30
  # Run analysis against the preview stack before allowing promotion.
  prePromotionAnalysis: false

# --- Canary ----------------------------------------------------------------
canary:
  # Weighted progressive rollout.
  steps:
    - setWeight: 20
    - pause: { duration: 60s }
    - setWeight: 50
    - pause: { duration: 120s }
    - setWeight: 80
    - pause: { duration: 60s }
  # Analysis runs continuously against the canary while it receives traffic.
  analysis: false

# Shared analysis settings for both strategies.
analysis:
  # VictoriaMetrics (Prometheus-compatible) endpoint for AnalysisTemplate queries.
  prometheusAddress: http://vmsingle-vm-monitoring.monitoring.svc.cluster.local:8429
  successRateThreshold: "0.95"
  intervalSeconds: 30
  count: 5

metrics:
  # Creates a VMServiceScrape so the monitoring stack scrapes /actuator/prometheus.
  serviceScrape:
    enabled: true
    path: /actuator/prometheus
    interval: 15s

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
env: []
