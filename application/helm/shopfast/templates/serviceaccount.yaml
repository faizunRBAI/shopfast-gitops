{{- include "shopfast.validate" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shopfast.serviceAccountName" . }}
  labels:
    {{- include "shopfast.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app calls no AWS APIs, so it gets no token it does not need.
automountServiceAccountToken: false
{{- end }}
