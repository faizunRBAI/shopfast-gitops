version: 1
name: shopfast-gitops
vcs: github

stages:
  - id: lint
    kind: lint
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate and compile
        working-directory: application
        run: mvn -B -ntp clean compile

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        working-directory: application
        run: mvn -B -ntp test
      - name: Package jar
        working-directory: application
        run: mvn -B -ntp -DskipTests package

  - id: security
    kind: security
    needs: [test]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm chart lint — every strategy must render
        run: |
          set -e
          for s in standard bluegreen canary; do
            echo "::group::helm lint strategy=$s"
            helm lint application/helm/shopfast \
              --set strategy=$s \
              --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/shopfast \
              --set image.tag=abc1234
            echo "::endgroup::"
          done
      - name: Verify Blue/Green and Canary never render a Deployment
        run: bash scripts/verify-chart-exclusivity.sh
      - name: Verify the GitOps manifests are fully resolved
        run: bash scripts/verify-gitops-manifests.sh
      - name: Verify the gated rollback refuses unsafe targets
        run: |
          # A rollback path is only trustworthy if its REFUSALS work, and you
          # find out they don't during an incident. This asserts, offline, that
          # rollback-resolve.sh refuses 'latest', refuses the bootstrap seed,
          # refuses a no-op, refuses to invent a target when there is no
          # history — and that nothing on the rollback path patches the Argo CD
          # Application spec (which selfHeal would fight forever).
          bash scripts/verify-rollback.sh
      - name: Verify the ACM certificate covers every declared hostname
        env:
          PROJECT: ${{ secrets.PROJECT_NAME }}
        run: |
          # Catches a certificate that does not name every declared hostname,
          # read-only, before any AWS resource is touched. This guard used to
          # compensate for infra/dns.tf ignoring SAN changes on an existing
          # certificate; that ignore_changes was REMOVED on 2026-09-07 (it had
          # frozen the SAN list permanently), so rotation is now ordinary and
          # this check is a genuine backstop rather than a workaround.
          bash scripts/verify-cert-sans.sh "$PROJECT"
      - name: Dependency vulnerability scanning runs out-of-band
        run: |
          # MOVED OUT OF THE DEPLOY PATH — 2026-09-07, owner decision.
          #
          # OWASP dependency-check must download the ENTIRE ~387,000-record NVD
          # corpus before it can inspect a single JAR; there is no partial mode.
          # That made every deployment gated on nvd.nist.gov's throughput:
          #   2026-09-06  ~97,000 rec/min  -> completed in 4m46s, stage PASSED
          #   2026-09-07  ~2,600 rec/min   -> 26% at the cap, stage cancelled
          #   2026-09-07  ~15,000 rec/min  -> NVD aborted the fetch itself
          #                                   (RejectedExecutionException)
          # Caching cannot rescue this: actions/cache only writes its entry when
          # the step succeeds, so a download that never finishes never seeds the
          # cache, and the next run starts cold again.
          #
          # NOTHING IS DISABLED. The same scripts/dependency-scan.sh, the same
          # pom.xml threshold and the same report artifacts now run in the
          # security-deps workflow (.github/workflows/security-deps.yml), which
          # also seeds the shared NVD cache that this deploy path no longer
          # needs. A bad NVD day now delays a REPORT instead of a DEPLOYMENT.
          echo "Dependency vulnerability scan: security-deps workflow (out-of-band)."
          echo "Report: Actions -> security-deps -> dependency-check-report artifact."
          echo "Threshold unchanged: application/pom.xml security.failBuildOnCVSS."

  - id: provision
    kind: provision
    needs: [security]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: royalbengal.xyz
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
      - name: ACTION REQUIRED — add the Grafana certificate validation CNAME in cPanel
        working-directory: infra
        run: bash ../scripts/print-cert-action.sh
      - name: Route 53 nameservers and full validation record set
        working-directory: infra
        run: |
          echo "::group::Nameservers for royalbengal.xyz (only if you delegate to Route 53)"
          terraform output -json route53_nameservers
          echo "::endgroup::"
          echo "::group::All ACM validation records (DNS stays on cPanel)"
          terraform output -json acm_validation_records
          echo "::endgroup::"

  - id: build_push
    kind: build_push
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Build jar
        working-directory: application
        run: mvn -B -ntp -DskipTests package
      - name: Resolve ECR registry and immutable tag
        id: img
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Read the ACM certificate ARN from terraform state
        id: tf
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cert=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${{ steps.img.outputs.registry }}"
      - name: Build and push image with immutable Git SHA tag
        working-directory: application
        env:
          REGISTRY: ${{ steps.img.outputs.registry }}
          TAG: ${{ steps.img.outputs.sha }}
          REPO_NAME: ${{ secrets.PROJECT_NAME }}
        run: |
          IMAGE="${REGISTRY}/${REPO_NAME}-shopfast:${TAG}"
          # ECR tags are IMMUTABLE: a re-run on the same SHA must not fail the build.
          if aws ecr describe-images --repository-name "${REPO_NAME}-shopfast" \
               --image-ids imageTag="${TAG}" >/dev/null 2>&1; then
            echo "Image already exists for this commit (immutable tag) — skipping push"
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
            echo "Pushed image for commit ${TAG}"
          fi
      - name: Scan image with Trivy (reporting mode)
        env:
          REGISTRY: ${{ steps.img.outputs.registry }}
          TAG: ${{ steps.img.outputs.sha }}
          REPO_NAME: ${{ secrets.PROJECT_NAME }}
        run: bash scripts/scan-image.sh "${REGISTRY}/${REPO_NAME}-shopfast:${TAG}"
      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: GitOps update — commit the image tag and certificate ARN
        env:
          REGISTRY: ${{ steps.img.outputs.registry }}
          TAG: ${{ steps.img.outputs.sha }}
          REPO_NAME: ${{ secrets.PROJECT_NAME }}
          CERT_ARN: ${{ steps.tf.outputs.cert }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/gitops-commit.sh

  - id: configure
    kind: configure
    needs: [provision, build_push]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
      ARGOCD_HOSTNAME: argocd.shopfast.royalbengal.xyz
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install python dependencies for bootstrap
        run: python3 -m pip install --quiet bcrypt
      - name: Check out the branch tip so the GitOps commit is present
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # build_push committed the desired state (image tag + certificate ARN)
          # to the branch. The default checkout pinned this job to the ORIGINAL
          # SHA, so without this fetch the bootstrap would read a stale values
          # file and its ARN precondition check would report a false warning.
          # The monitoring child carries Grafana's ingress certificate ARN and
          # is rewritten by the same commit, so it must be refreshed too.
          git fetch origin "${BRANCH}"
          git checkout "origin/${BRANCH}" -- gitops/applications/shopfast/values.yaml
          git checkout "origin/${BRANCH}" -- gitops/apps/children/monitoring.yaml
          echo "Desired state refreshed from origin/${BRANCH}."
      - name: Read cluster identity from terraform state
        id: tf
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "cert=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster }}"
      - name: Bootstrap platform (ALB controller, Argo CD, App-of-Apps)
        env:
          CERT_ARN: ${{ steps.tf.outputs.cert }}
        run: bash gitops/bootstrap/bootstrap.sh

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      GRAFANA_HOSTNAME: grafana.shopfast.royalbengal.xyz
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Read cluster identity and current certificate from terraform state
        id: tf
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          aws eks update-kubeconfig --region us-east-1 \
            --name "$(terraform output -raw eks_cluster_name)"
          echo "cert=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
      - name: Verify real AWS / EKS / Argo CD state
        run: bash gitops/bootstrap/verify.sh
      - name: Retire superseded ACM certificates
        env:
          CURRENT_CERT_ARN: ${{ steps.tf.outputs.cert }}
          PROJECT: ${{ secrets.PROJECT_NAME }}
        run: |
          # Runs LAST, after verify.sh has confirmed the platform is healthy and
          # after configure moved the ALB listeners onto the current certificate.
          # Only deletes certificates tagged for this project whose InUseBy list
          # is EMPTY — anything still attached is skipped, never forced. This is
          # what replaces the in-apply destroy that deadlocked provision.
          bash scripts/prune-retired-certs.sh "$PROJECT" "$CURRENT_CERT_ARN"

pipelines:
  - id: rollback
    stages:
      - id: gated_rollback
        kind: custom
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        steps:
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.0
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.9.8"
              terraform_wrapper: false
          - name: Install the Argo Rollouts kubectl plugin
            run: |
              # Needed to ABORT an in-flight rollout so traffic returns to the
              # stable version immediately, before the (slower, durable) git
              # rewrite lands. Pinned to the controller line running in the
              # cluster.
              curl -sSL -o /tmp/kubectl-argo-rollouts \
                https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
              chmod +x /tmp/kubectl-argo-rollouts
              sudo mv /tmp/kubectl-argo-rollouts /usr/local/bin/kubectl-argo-rollouts
              kubectl argo rollouts version
          - name: Fetch the deploy history
            env:
              BRANCH: ${{ github.ref_name }}
            run: |
              # The rendered checkout is SHALLOW (depth 1). rollback-resolve.sh
              # walks the git history of the values file to find the previous
              # deployed tag, and a shallow clone has none — it would report
              # "no history" and refuse. Unshallow before resolving.
              git fetch --unshallow --quiet || git fetch --depth=200 --quiet || true
              git fetch origin "${BRANCH}" --quiet
              git checkout "origin/${BRANCH}" -- gitops/applications/shopfast/values.yaml
              echo "Deploy history available:"
              git log --oneline -n 10 -- gitops/applications/shopfast/values.yaml
          - name: Connect to the cluster
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
              aws eks update-kubeconfig --region us-east-1 \
                --name "$(terraform output -raw eks_cluster_name)"
          - name: Gated rollback
            env:
              APP_NAME: shopfast
              APP_NAMESPACE: shopfast
              ARGOCD_NAMESPACE: argocd
              VALUES_FILE: gitops/applications/shopfast/values.yaml
              ECR_REPOSITORY: ${{ secrets.PROJECT_NAME }}-shopfast
              TARGET_TAG: ${{ vars.ROLLBACK_TARGET_TAG }}
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              BRANCH: ${{ github.ref_name }}
            run: |
              # GATED: this workflow only ever runs because a human dispatched
              # it from the Actions tab. It is not a stage of the deploy and it
              # never fires automatically off a green pipeline.
              #
              # DEFAULT (the common case): restore the PREVIOUS deployed version.
              # Dispatch it with nothing else set and rollback-resolve.sh walks
              # the values file's git history to find the last different tag.
              #
              # ROLLING BACK FURTHER: set the repository variable
              # ROLLBACK_TARGET_TAG (Settings -> Secrets and variables ->
              # Actions -> Variables) to an immutable Git SHA tag, dispatch,
              # then CLEAR the variable again so the next rollback defaults to
              # "previous" instead of silently reusing a stale pin.
              #
              # A repository variable rather than a workflow_dispatch input:
              # this workflow is RENDERED from .udap/pipeline.yaml, whose schema
              # has no way to declare dispatch inputs, and hand-editing the
              # rendered file would be overwritten on the next render.
              #
              # Either way the target is validated before anything moves:
              # 'latest', the bootstrap seed, a no-op, and any tag missing from
              # ECR are all refused.
              bash scripts/rollback.sh

  - id: state-fix
    stages:
      - id: drop_certificate_from_state
        kind: custom
        timeout_minutes: 15
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_region: us-east-1
          TF_VAR_base_domain: royalbengal.xyz
          TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
          TF_VAR_app_hostname: shopfast.royalbengal.xyz
          TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.9.8"
              terraform_wrapper: false
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Drop the platform certificate from terraform state
            run: |
              # ONE-SHOT MANUAL REPAIR — dispatch-only, NEVER in the deploy path.
              #
              # Removes the STATE ENTRY aws_acm_certificate.platform. Nothing is
              # deleted in AWS: both certificates stay in ACM and the ALB keeps
              # serving traffic while this runs.
              #
              # WHY: infra/dns.tf carried ignore_changes on the SAN list, so the
              # SAN list was read at CREATE time only and terraform would never
              # replace the certificate. State was pinned to the OLD 2-SAN cert
              # (argocd + apex, no grafana) permanently. That ignore_changes is
              # removed in this same commit; dropping the resource from state is
              # what lets the next apply CREATE a 3-SAN certificate.
              #
              # The address is LITERAL and the script does no discovery. Two
              # earlier repair scripts tried to FIND their target with
              # `terraform state list` / `show -json` and got it wrong — state
              # list cannot see deposed objects at all. Removing the address
              # takes the current object AND the deposed 19b0aa2c leftover.
              #
              # Idempotent: a second run finds nothing and exits 0.
              bash scripts/state-drop-certificate.sh

  - id: security-deps
    stages:
      - id: dependency_scan
        kind: security
        timeout_minutes: 180
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "21"
              cache: maven
          - name: Restore the NVD vulnerability database
            uses: actions/cache@v4
            with:
              # This workflow is the ONLY writer of this cache, and it is the
              # reason the scan lives here rather than in the deploy path: the
              # full NVD corpus is ~387,000 records and actions/cache only saves
              # its entry when the job SUCCEEDS. With a 3-hour budget the
              # download can finish even on a degraded feed and finally seed the
              # cache; later runs then fetch only the delta.
              path: ~/.dependency-check-data
              key: nvd-db-${{ github.run_id }}
              restore-keys: |
                nvd-db-
          - name: OWASP dependency vulnerability scan (reporting mode)
            env:
              NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
            run: bash scripts/dependency-scan.sh
          - name: Upload dependency-check report
            uses: actions/upload-artifact@v4
            with:
              name: dependency-check-report
              path: |
                application/target/dependency-check-report.html
                application/target/dependency-check-report.json
              retention-days: 30
              if-no-files-found: warn

rollback:
  strategy: manual
