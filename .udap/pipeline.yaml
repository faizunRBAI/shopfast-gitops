version: 1
name: shopfast-gitops
vcs: github

stages:
  - id: lint
    kind: lint
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate and compile
        working-directory: application
        run: mvn -B -ntp clean compile

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        working-directory: application
        run: mvn -B -ntp test
      - name: Package jar
        working-directory: application
        run: mvn -B -ntp -DskipTests package

  - id: security
    kind: security
    needs: [test]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm chart lint — every strategy must render
        run: |
          set -e
          for s in standard bluegreen canary; do
            echo "::group::helm lint strategy=$s"
            helm lint application/helm/shopfast \
              --set strategy=$s \
              --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/shopfast \
              --set image.tag=abc1234
            echo "::endgroup::"
          done
      - name: Verify Blue/Green and Canary never render a Deployment
        run: bash scripts/verify-chart-exclusivity.sh
      - name: Verify the GitOps manifests are fully resolved
        run: bash scripts/verify-gitops-manifests.sh
      - name: Verify the ACM certificate covers every declared hostname
        env:
          PROJECT: ${{ secrets.PROJECT_NAME }}
        run: |
          # infra/dns.tf ignores SAN changes on an existing certificate (that is
          # what broke the destroy-deadlock), so a new hostname would otherwise
          # go green in CI while serving a mismatched certificate. This catches
          # that divergence read-only, before any AWS resource is touched.
          bash scripts/verify-cert-sans.sh "$PROJECT"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP dependency vulnerability scan (reporting mode)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash scripts/dependency-scan.sh
      - name: Upload dependency-check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            application/target/dependency-check-report.html
            application/target/dependency-check-report.json
          retention-days: 30
          if-no-files-found: warn

  - id: provision
    kind: provision
    needs: [security]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: royalbengal.xyz
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: ONE-SHOT REPAIR — drop the stranded deposed ACM certificate object
        working-directory: infra
        run: |
          # TEMPORARY. Remove this step and scripts/drop-deposed-cert.sh once it
          # has reported "nothing to repair" on a run.
          #
          # The 2026-09-06 apply was cancelled mid-destroy of the superseded
          # certificate (ACM blocks deleting a cert attached to the ALB listener,
          # and the listener only moves in the configure stage). That left the old
          # object DEPOSED in state. No lifecycle rule suppresses a deposed
          # object, so terraform retries the impossible delete on every apply and
          # provision can never reach configure — a closed loop.
          #
          # `state rm` makes terraform FORGET the object; it deletes nothing in
          # AWS. The certificate keeps serving traffic and is retired later by
          # verify's prune step, which only deletes detached certificates.
          bash ../scripts/drop-deposed-cert.sh
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
      - name: ACTION REQUIRED — add the Grafana certificate validation CNAME in cPanel
        working-directory: infra
        run: bash ../scripts/print-cert-action.sh
      - name: Route 53 nameservers and full validation record set
        working-directory: infra
        run: |
          echo "::group::Nameservers for royalbengal.xyz (only if you delegate to Route 53)"
          terraform output -json route53_nameservers
          echo "::endgroup::"
          echo "::group::All ACM validation records (DNS stays on cPanel)"
          terraform output -json acm_validation_records
          echo "::endgroup::"

  - id: build_push
    kind: build_push
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Build jar
        working-directory: application
        run: mvn -B -ntp -DskipTests package
      - name: Resolve ECR registry and immutable tag
        id: img
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Read the ACM certificate ARN from terraform state
        id: tf
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cert=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${{ steps.img.outputs.registry }}"
      - name: Build and push image with immutable Git SHA tag
        working-directory: application
        env:
          REGISTRY: ${{ steps.img.outputs.registry }}
          TAG: ${{ steps.img.outputs.sha }}
          REPO_NAME: ${{ secrets.PROJECT_NAME }}
        run: |
          IMAGE="${REGISTRY}/${REPO_NAME}-shopfast:${TAG}"
          # ECR tags are IMMUTABLE: a re-run on the same SHA must not fail the build.
          if aws ecr describe-images --repository-name "${REPO_NAME}-shopfast" \
               --image-ids imageTag="${TAG}" >/dev/null 2>&1; then
            echo "Image already exists for this commit (immutable tag) — skipping push"
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
            echo "Pushed image for commit ${TAG}"
          fi
      - name: Scan image with Trivy (reporting mode)
        env:
          REGISTRY: ${{ steps.img.outputs.registry }}
          TAG: ${{ steps.img.outputs.sha }}
          REPO_NAME: ${{ secrets.PROJECT_NAME }}
        run: bash scripts/scan-image.sh "${REGISTRY}/${REPO_NAME}-shopfast:${TAG}"
      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: GitOps update — commit the image tag and certificate ARN
        env:
          REGISTRY: ${{ steps.img.outputs.registry }}
          TAG: ${{ steps.img.outputs.sha }}
          REPO_NAME: ${{ secrets.PROJECT_NAME }}
          CERT_ARN: ${{ steps.tf.outputs.cert }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/gitops-commit.sh

  - id: configure
    kind: configure
    needs: [provision, build_push]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
      ARGOCD_HOSTNAME: argocd.shopfast.royalbengal.xyz
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install python dependencies for bootstrap
        run: python3 -m pip install --quiet bcrypt
      - name: Check out the branch tip so the GitOps commit is present
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # build_push committed the desired state (image tag + certificate ARN)
          # to the branch. The default checkout pinned this job to the ORIGINAL
          # SHA, so without this fetch the bootstrap would read a stale values
          # file and its ARN precondition check would report a false warning.
          # The monitoring child carries Grafana's ingress certificate ARN and
          # is rewritten by the same commit, so it must be refreshed too.
          git fetch origin "${BRANCH}"
          git checkout "origin/${BRANCH}" -- gitops/applications/shopfast/values.yaml
          git checkout "origin/${BRANCH}" -- gitops/apps/children/monitoring.yaml
          echo "Desired state refreshed from origin/${BRANCH}."
      - name: Read cluster identity from terraform state
        id: tf
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "cluster=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "cert=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster }}"
      - name: Bootstrap platform (ALB controller, Argo CD, App-of-Apps)
        env:
          CERT_ARN: ${{ steps.tf.outputs.cert }}
        run: bash gitops/bootstrap/bootstrap.sh

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      GRAFANA_HOSTNAME: grafana.shopfast.royalbengal.xyz
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Read cluster identity and current certificate from terraform state
        id: tf
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          aws eks update-kubeconfig --region us-east-1 \
            --name "$(terraform output -raw eks_cluster_name)"
          echo "cert=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
      - name: Verify real AWS / EKS / Argo CD state
        run: bash gitops/bootstrap/verify.sh
      - name: Retire superseded ACM certificates
        env:
          CURRENT_CERT_ARN: ${{ steps.tf.outputs.cert }}
          PROJECT: ${{ secrets.PROJECT_NAME }}
        run: |
          # Runs LAST, after verify.sh has confirmed the platform is healthy and
          # after configure moved the ALB listeners onto the current certificate.
          # Only deletes certificates tagged for this project whose InUseBy list
          # is EMPTY — anything still attached is skipped, never forced. This is
          # what replaces the in-apply destroy that deadlocked provision.
          bash scripts/prune-retired-certs.sh "$PROJECT" "$CURRENT_CERT_ARN"

rollback:
  strategy: manual
