name: destroy
'on':
  workflow_dispatch: {}
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: royalbengal.xyz
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.31.0
    - name: "Release the ALB and its certificate before destroying the VPC"
      run: "set -uo pipefail\n# The ALB, its ENIs and the EIP mapping are created by the\n\
        # AWS Load Balancer Controller, NOT by terraform. Left in place they hold\n\
        # the public subnets, the internet gateway and the ACM certificate, so\n\
        # terraform destroy fails with DependencyViolation / ResourceInUseException.\n\
        # Deleting the Ingress objects makes the controller tear the ALB down and\n\
        # detach the certificate. Best-effort: if the cluster is already gone there\n\
        # is nothing to release and destroy proceeds normally.\nCLUSTER=\"$(aws eks\
        \ list-clusters --region \"${AWS_REGION}\" \\\n  --query \"clusters[?starts_with(@,\
        \ '${TF_VAR_project_name}')] | [0]\" --output text 2>/dev/null || echo None)\"\
        \nif [ -z \"${CLUSTER}\" ] || [ \"${CLUSTER}\" = \"None\" ]; then\n  echo \"\
        No EKS cluster found — nothing to release.\"\n  exit 0\nfi\naws eks update-kubeconfig\
        \ --region \"${AWS_REGION}\" --name \"${CLUSTER}\" || exit 0\nkubectl delete\
        \ ingress --all --all-namespaces --ignore-not-found --timeout=5m || true\n\
        echo \"Waiting for the load balancer controller to delete the ALB...\"\nfor\
        \ i in $(seq 1 60); do\n  COUNT=\"$(aws elbv2 describe-load-balancers --region\
        \ \"${AWS_REGION}\" \\\n    --query \"length(LoadBalancers[?VpcId!=null])\"\
        \ --output text 2>/dev/null || echo 0)\"\n  IN_USE=\"$(aws acm list-certificates\
        \ --region \"${AWS_REGION}\" \\\n    --query 'CertificateSummaryList[].CertificateArn'\
        \ --output text | tr '\\t' '\\n' | while read -r a; do\n      [ -n \"$a\" ]\
        \ || continue\n      aws acm describe-certificate --region \"${AWS_REGION}\"\
        \ --certificate-arn \"$a\" \\\n        --query 'length(Certificate.InUseBy)'\
        \ --output text\n    done | grep -vc '^0$' || true)\"\n  if [ \"${IN_USE:-0}\"\
        \ = \"0\" ]; then\n    echo \"No certificate is attached any more.\"\n    break\n\
        \  fi\n  sleep 10\ndone\n"
    - name: Terraform destroy
      working-directory: infra
      run: "set -euo pipefail\nregion=\"${AWS_REGION:-}\"\ncompat=\"\"\nif [ -n \"\
        ${AWS_ENDPOINT_URL_S3:-}\" ]; then\n  host=\"${AWS_ENDPOINT_URL_S3#https://}\"\
        \n  region=\"${host%%.*}\"\n  compat=\"-backend-config=skip_credentials_validation=true\
        \ -backend-config=skip_requesting_account_id=true -backend-config=skip_metadata_api_check=true\
        \ -backend-config=skip_region_validation=true -backend-config=skip_s3_checksum=true\
        \ -backend-config=use_path_style=true\"\nfi\nterraform init -input=false -reconfigure\
        \ \\\n  -backend-config=\"bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"\
        key=${{ secrets.PROJECT_NAME }}/terraform.tfstate\" \\\n  -backend-config=\"\
        region=${region}\" $compat\nterraform destroy -input=false -auto-approve"