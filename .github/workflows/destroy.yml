name: destroy
'on':
  workflow_dispatch: {}
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: royalbengal.xyz
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
    # THE BACKEND MUST BE INITIALISED BEFORE ANY `terraform output`.
    #
    # This step used to not exist. The cleanup step below reads
    # `terraform output -raw vpc_id`, but the only `terraform init` in this
    # workflow lived in the Terraform destroy step AFTER it. So the output
    # call ran against an uninitialised backend, failed, and VPC_ID came back
    # empty — visible in the failed run as the output of the error bleeding
    # into the echo line:
    #
    #   Target VPC: ::error::Terraform exited with code 1.
    #
    # An empty VPC_ID skipped the load balancer deletion loop and hard-coded
    # the wait's COUNT to 0, so the orphaned ALB was never deleted. Its ENIs
    # then pinned the public subnets and the internet gateway and its listener
    # held the ACM certificate — the DependencyViolation /
    # ResourceInUseException that hung `terraform destroy` until the job was
    # cancelled. Initialising here is what makes the cleanup able to see the
    # VPC at all.
      - name: Terraform init
        working-directory: infra
        run: "set -euo pipefail\nregion=\"${AWS_REGION:-}\"\ncompat=\"\"\nif [ -n \"${AWS_ENDPOINT_URL_S3:-}\" ]; then\n  host=\"${AWS_ENDPOINT_URL_S3#https://}\"\n  region=\"${host%%.*}\"\n  compat=\"-backend-config=skip_credentials_validation=true -backend-config=skip_requesting_account_id=true -backend-config=skip_metadata_api_check=true -backend-config=skip_region_validation=true -backend-config=skip_s3_checksum=true -backend-config=use_path_style=true\"\nfi\nterraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME }}/terraform.tfstate\" \\\n  -backend-config=\"region=${region}\" $compat\n"
      - name: "Release the ALB and its certificate before destroying the VPC"
        run: "set -uo pipefail\n# The ALB, its ENIs and the EIP mapping are created by the\n# AWS Load Balancer Controller, NOT by terraform. Left in place they hold\n# the public subnets, the internet gateway and the ACM certificate, so\n# terraform destroy fails with DependencyViolation / ResourceInUseException.\n# Deleting the Ingress objects makes the controller tear the ALB down and\n# detach the certificate. Best-effort: if the cluster is already gone there\n# is nothing to release and destroy proceeds normally.\nCLUSTER=\"$(aws eks list-clusters --region \"${AWS_REGION}\" \\\n  --query \"clusters[?starts_with(@, '${TF_VAR_project_name}')] | [0]\" --output text 2>/dev/null || echo None)\"\nif [ -n \"${CLUSTER}\" ] && [ \"${CLUSTER}\" != \"None\" ]; then\n  aws eks update-kubeconfig --region \"${AWS_REGION}\" --name \"${CLUSTER}\" \\\n    && kubectl delete ingress --all --all-namespaces --ignore-not-found --timeout=5m || true\nelse\n  echo \"No EKS cluster found — nothing to delete via kubectl.\"\nfi\n\n# THE CLUSTER MAY ALREADY BE GONE while its ALB survives: the load\n# balancer controller runs IN the cluster, so once the cluster is deleted\n# nothing is left to tear the ALB down. Its ENIs then pin the public\n# subnets, its public addresses pin the internet gateway, and its HTTPS\n# listener pins the ACM certificate — exactly the three DependencyViolation\n# / ResourceInUseException errors terraform destroy reported. So delete any\n# load balancer left in THIS VPC directly, by ARN, regardless of whether a\n# cluster still exists.\n#\n# The backend is initialised by the Terraform init step above, so this\n# output actually resolves. Do NOT reorder those two steps.\nVPC_ID=\"$(cd infra && terraform output -raw vpc_id 2>/dev/null || true)\"\nif [ -z \"${VPC_ID}\" ] || [ \"${VPC_ID}\" = \"None\" ]; then\n  VPC_ID=\"$(aws ec2 describe-vpcs --region \"${AWS_REGION}\" \\\n    --filters \"Name=tag:Project,Values=${TF_VAR_project_name}\" \\\n    --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo None)\"\nfi\necho \"Target VPC: ${VPC_ID:-unknown}\"\n\n# A VPC we cannot name is a VPC we cannot clean up. Saying so here turns\n# a silent no-op into a visible warning instead of a 15-minute hang in\n# terraform destroy on a DependencyViolation.\nif [ -z \"${VPC_ID}\" ] || [ \"${VPC_ID}\" = \"None\" ]; then\n  echo \"WARNING: could not resolve the platform VPC from terraform state or by tag.\"\n  echo \"         Any orphaned load balancer cannot be found, and destroy may\"\n  echo \"         fail on DependencyViolation. Continuing anyway.\"\nfi\n\nif [ -n \"${VPC_ID}\" ] && [ \"${VPC_ID}\" != \"None\" ]; then\n  for arn in $(aws elbv2 describe-load-balancers --region \"${AWS_REGION}\" \\\n      --query \"LoadBalancers[?VpcId=='${VPC_ID}'].LoadBalancerArn\" \\\n      --output text 2>/dev/null | tr '\\t' '\\n'); do\n    [ -n \"$arn\" ] || continue\n    echo \"Deleting orphaned load balancer $arn\"\n    aws elbv2 delete-load-balancer --region \"${AWS_REGION}\" --load-balancer-arn \"$arn\" || true\n  done\nfi\n\n# Only THIS PROJECT's certificates can ever be released by deleting THIS\n# project's load balancers. The previous version counted every in-use\n# certificate in the account, so an unrelated certificate attached to an\n# unrelated resource pinned the counter above zero forever — the failed run\n# printed 'certificates-in-use=2' on all 60 iterations and never broke out.\necho \"Waiting for the load balancers and their ENIs to disappear...\"\nfor i in $(seq 1 60); do\n  if [ -n \"${VPC_ID}\" ] && [ \"${VPC_ID}\" != \"None\" ]; then\n    COUNT=\"$(aws elbv2 describe-load-balancers --region \"${AWS_REGION}\" \\\n      --query \"length(LoadBalancers[?VpcId=='${VPC_ID}'])\" --output text 2>/dev/null || echo 0)\"\n  else\n    COUNT=0\n  fi\n  IN_USE=\"$(aws acm list-certificates --region \"${AWS_REGION}\" \\\n    --query 'CertificateSummaryList[].CertificateArn' --output text | tr '\\t' '\\n' | while read -r a; do\n      [ -n \"$a\" ] || continue\n      owner=\"$(aws acm list-tags-for-certificate --region \"${AWS_REGION}\" --certificate-arn
          \"$a\" \\\n        --query \"Tags[?Key=='Project'].Value | [0]\" --output text 2>/dev/null || echo None)\"\n      [ \"$owner\" = \"${TF_VAR_project_name}\" ] || continue\n      aws acm describe-certificate --region \"${AWS_REGION}\" --certificate-arn \"$a\" \\\n        --query 'length(Certificate.InUseBy)' --output text\n    done | grep -vc '^0$' || true)\"\n  if [ \"${COUNT:-0}\" = \"0\" ] && [ \"${IN_USE:-0}\" = \"0\" ]; then\n    echo \"No load balancer remains in the VPC and no project certificate is attached.\"\n    break\n  fi\n  echo \"  load balancers=${COUNT} certificates-in-use=${IN_USE}; waiting...\"\n  sleep 10\ndone\n\n# The controller-managed ENIs can linger briefly after the\n# load balancer is deleted; they are what actually hold the subnets.\nfor i in $(seq 1 30); do\n  if [ -z \"${VPC_ID}\" ] || [ \"${VPC_ID}\" = \"None\" ]; then break; fi\n  ENIS=\"$(aws ec2 describe-network-interfaces --region \"${AWS_REGION}\" \\\n    --filters \"Name=vpc-id,Values=${VPC_ID}\" \"Name=description,Values=ELB*\" \\\n    --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null || true)\"\n  [ -z \"${ENIS}\" ] && { echo \"No load balancer ENIs remain.\"; break; }\n  echo \"  waiting for ELB ENIs to be released: ${ENIS}\"\n  sleep 10\ndone\n"
      - name: Terraform destroy
        working-directory: infra
        run: "set -euo pipefail\nterraform destroy -input=false -auto-approve"
