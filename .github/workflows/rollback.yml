# GENERATED by UDAP Build Project from .udap/pipeline.yaml — do not
# edit by hand; change the spec and re-render.
name: rollback
'on':
  workflow_dispatch: {}
jobs:
  gated_rollback:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.31.0
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Install the Argo Rollouts kubectl plugin
      run: "# Needed to ABORT an in-flight rollout so traffic returns to the\n# stable\
        \ version immediately, before the (slower, durable) git\n# rewrite lands.\
        \ Pinned to the controller line running in the\n# cluster.\ncurl -sSL -o /tmp/kubectl-argo-rollouts\
        \ \\\n  https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64\n\
        chmod +x /tmp/kubectl-argo-rollouts\nsudo mv /tmp/kubectl-argo-rollouts /usr/local/bin/kubectl-argo-rollouts\n\
        kubectl argo rollouts version\n"
    - name: Fetch the deploy history
      run: "# The rendered checkout is SHALLOW (depth 1). rollback-resolve.sh\n# walks\
        \ the git history of the values file to find the previous\n# deployed tag,\
        \ and a shallow clone has none \u2014 it would report\n# \"no history\" and\
        \ refuse. Unshallow before resolving.\ngit fetch --unshallow --quiet || git\
        \ fetch --depth=200 --quiet || true\ngit fetch origin \"${BRANCH}\" --quiet\n\
        git checkout \"origin/${BRANCH}\" -- gitops/applications/shopfast/values.yaml\n\
        echo \"Deploy history available:\"\ngit log --oneline -n 10 -- gitops/applications/shopfast/values.yaml\n"
      env:
        BRANCH: ${{ github.ref_name }}
    - name: Connect to the cluster
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\naws eks\
        \ update-kubeconfig --region us-east-1 \\\n  --name \"$(terraform output -raw\
        \ eks_cluster_name)\"\n"
      working-directory: infra
    - name: Gated rollback
      run: '# GATED: this workflow only ever runs because a human dispatched

        # it from the Actions tab. It is not a stage of the deploy and it

        # never fires automatically off a green pipeline.

        #

        # DEFAULT (the common case): restore the PREVIOUS deployed version.

        # Dispatch it with nothing else set and rollback-resolve.sh walks

        # the values file''s git history to find the last different tag.

        #

        # ROLLING BACK FURTHER: set the repository variable

        # ROLLBACK_TARGET_TAG (Settings -> Secrets and variables ->

        # Actions -> Variables) to an immutable Git SHA tag, dispatch,

        # then CLEAR the variable again so the next rollback defaults to

        # "previous" instead of silently reusing a stale pin.

        #

        # A repository variable rather than a workflow_dispatch input:

        # this workflow is RENDERED from .udap/pipeline.yaml, whose schema

        # has no way to declare dispatch inputs, and hand-editing the

        # rendered file would be overwritten on the next render.

        #

        # Either way the target is validated before anything moves:

        # ''latest'', the bootstrap seed, a no-op, and any tag missing from

        # ECR are all refused.

        bash scripts/rollback.sh

        '
      env:
        APP_NAME: shopfast
        APP_NAMESPACE: shopfast
        ARGOCD_NAMESPACE: argocd
        VALUES_FILE: gitops/applications/shopfast/values.yaml
        ECR_REPOSITORY: ${{ secrets.PROJECT_NAME }}-shopfast
        TARGET_TAG: ${{ vars.ROLLBACK_TARGET_TAG }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: ${{ github.ref_name }}
