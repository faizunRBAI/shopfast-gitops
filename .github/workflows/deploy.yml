        \necho \"cert=$(terraform output -raw acm_certificate_arn)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster
        }}"
    - name: Bootstrap platform (ALB controller, Argo CD, App-of-Apps)
