name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Validate and compile
      run: mvn -B -ntp clean compile
      working-directory: application
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Unit tests
      run: mvn -B -ntp test
      working-directory: application
    - name: Package jar
      run: mvn -B -ntp -DskipTests package
      working-directory: application
  security:
    runs-on: ubuntu-latest
    needs:
    - test
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.2
    - name: "Helm chart lint \u2014 every strategy must render"
      run: "set -e\n# FIXTURES: _validate.tpl fails the render unless strategy,\n\
        # image.repository, image.tag AND ingress.certificateArn are all\n# present.\
        \ The chart's values.yaml deliberately ships certificateArn\n# empty (CI writes\
        \ the real ARN, the Argo CD Application layers it on),\n# so a bare render\
        \ can never succeed by design. The dummy ARN below has\n# the correct SHAPE\
        \ and is not a credential.\n#\n# `helm lint` alone is NOT sufficient: it DOWNGRADES\
        \ a template `fail`\n# to an informational line and still reports \"0 chart(s)\
        \ failed\". That\n# is exactly how a missing fixture stayed invisible here\
        \ while\n# verify-chart-exclusivity.sh (which uses `helm template`) died on\
        \ it.\n# So this step now runs `helm template` too \u2014 that is the one\
        \ that\n# actually proves the strategy renders.\nCERT_ARN=\"arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000\"\
        \nfor s in standard bluegreen canary; do\n  echo \"::group::helm lint strategy=$s\"\
        \n  helm lint application/helm/shopfast \\\n    --set strategy=$s \\\n   \
        \ --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/shopfast\
        \ \\\n    --set image.tag=abc1234 \\\n    --set \"ingress.certificateArn=${CERT_ARN}\"\
        \n  echo \"::endgroup::\"\n  echo \"::group::helm template strategy=$s (lint\
        \ downgrades fail; this does not)\"\n  helm template shopfast application/helm/shopfast\
        \ \\\n    --set strategy=$s \\\n    --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/shopfast\
        \ \\\n    --set image.tag=abc1234 \\\n    --set \"ingress.certificateArn=${CERT_ARN}\"\
        \ >/dev/null\n  echo \"renders cleanly\"\n  echo \"::endgroup::\"\ndone\n"
    - name: Verify Blue/Green and Canary never render a Deployment
      run: bash scripts/verify-chart-exclusivity.sh
    - name: Verify the GitOps manifests are fully resolved
      run: bash scripts/verify-gitops-manifests.sh
    - name: Verify the gated rollback refuses unsafe targets
      run: "# A rollback path is only trustworthy if its REFUSALS work, and you\n\
        # find out they don't during an incident. This asserts, offline, that\n# rollback-resolve.sh\
        \ refuses 'latest', refuses the bootstrap seed,\n# refuses a no-op, refuses\
        \ to invent a target when there is no\n# history \u2014 and that nothing on\
        \ the rollback path patches the Argo CD\n# Application spec (which selfHeal\
        \ would fight forever).\nbash scripts/verify-rollback.sh\n"
    - name: Verify the ACM certificate covers every declared hostname
      run: '# Catches a certificate that does not name every declared hostname,

        # read-only, before any AWS resource is touched. This guard used to

        # compensate for infra/dns.tf ignoring SAN changes on an existing

        # certificate; that ignore_changes was REMOVED on 2026-09-07 (it had

        # frozen the SAN list permanently), so rotation is now ordinary and

        # this check is a genuine backstop rather than a workaround.

        bash scripts/verify-cert-sans.sh "$PROJECT"

        '
      env:
        PROJECT: ${{ secrets.PROJECT_NAME }}
    - name: Dependency vulnerability scanning runs out-of-band
      run: "# MOVED OUT OF THE DEPLOY PATH \u2014 2026-09-07, owner decision.\n#\n\
        # OWASP dependency-check must download the ENTIRE ~387,000-record NVD\n# corpus\
        \ before it can inspect a single JAR; there is no partial mode.\n# That made\
        \ every deployment gated on nvd.nist.gov's throughput:\n#   2026-09-06  ~97,000\
        \ rec/min  -> completed in 4m46s, stage PASSED\n#   2026-09-07  ~2,600 rec/min\
        \   -> 26% at the cap, stage cancelled\n#   2026-09-07  ~15,000 rec/min  ->\
        \ NVD aborted the fetch itself\n#                                   (RejectedExecutionException)\n\
        # Caching cannot rescue this: actions/cache only writes its entry when\n#\
        \ the step succeeds, so a download that never finishes never seeds the\n#\
        \ cache, and the next run starts cold again.\n#\n# NOTHING IS DISABLED. The\
        \ same scripts/dependency-scan.sh, the same\n# pom.xml threshold and the same\
        \ report artifacts now run in the\n# security-deps workflow (.github/workflows/security-deps.yml),\
        \ which\n# also seeds the shared NVD cache that this deploy path no longer\n\
        # needs. A bad NVD day now delays a REPORT instead of a DEPLOYMENT.\necho\
        \ \"Dependency vulnerability scan: security-deps workflow (out-of-band).\"\
        \necho \"Report: Actions -> security-deps -> dependency-check-report artifact.\"\
        \necho \"Threshold unchanged: application/pom.xml security.failBuildOnCVSS.\"\
        \n"
  provision:
    runs-on: ubuntu-latest
    needs:
    - security
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: royalbengal.xyz
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform validate
      run: terraform validate
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -auto-approve
      working-directory: infra
    - name: "ACTION REQUIRED \u2014 add the Grafana certificate validation CNAME in\
        \ cPanel"
      run: bash ../scripts/print-cert-action.sh
      working-directory: infra
    - name: Route 53 nameservers and full validation record set
      run: 'echo "::group::Nameservers for royalbengal.xyz (only if you delegate to
        Route 53)"

        terraform output -json route53_nameservers

        echo "::endgroup::"

        echo "::group::All ACM validation records (DNS stays on cPanel)"

        terraform output -json acm_validation_records

        echo "::endgroup::"

        '
      working-directory: infra
  build_push:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Build jar
      run: mvn -B -ntp -DskipTests package
      working-directory: application
    - id: img
      name: Resolve ECR registry and immutable tag
      run: 'ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

        echo "registry=${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com" >> "$GITHUB_OUTPUT"

        echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

        '
    - id: tf
      name: Read the ACM certificate ARN from terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cert=$(terraform output -raw acm_certificate_arn)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Login to ECR
      run: "aws ecr get-login-password --region us-east-1 \\\n  | docker login --username\
        \ AWS --password-stdin \"${{ steps.img.outputs.registry }}\"\n"
    - name: Build and push image with immutable Git SHA tag
      run: "IMAGE=\"${REGISTRY}/${REPO_NAME}-shopfast:${TAG}\"\n# ECR tags are IMMUTABLE:\
        \ a re-run on the same SHA must not fail the build.\nif aws ecr describe-images\
        \ --repository-name \"${REPO_NAME}-shopfast\" \\\n     --image-ids imageTag=\"\
        ${TAG}\" >/dev/null 2>&1; then\n  echo \"Image already exists for this commit\
        \ (immutable tag) \u2014 skipping push\"\nelse\n  docker build -t \"$IMAGE\"\
        \ .\n  docker push \"$IMAGE\"\n  echo \"Pushed image for commit ${TAG}\"\n\
        fi\n"
      working-directory: application
      env:
        REGISTRY: ${{ steps.img.outputs.registry }}
        TAG: ${{ steps.img.outputs.sha }}
        REPO_NAME: ${{ secrets.PROJECT_NAME }}
    - name: Scan image with Trivy (reporting mode)
      run: bash scripts/scan-image.sh "${REGISTRY}/${REPO_NAME}-shopfast:${TAG}"
      env:
        REGISTRY: ${{ steps.img.outputs.registry }}
        TAG: ${{ steps.img.outputs.sha }}
        REPO_NAME: ${{ secrets.PROJECT_NAME }}
    - name: Upload Trivy image report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-report
        path: trivy-image-report.json
        retention-days: 30
        if-no-files-found: warn
    - name: "GitOps update \u2014 commit the image tag and certificate ARN"
      run: bash scripts/gitops-commit.sh
      env:
        REGISTRY: ${{ steps.img.outputs.registry }}
        TAG: ${{ steps.img.outputs.sha }}
        REPO_NAME: ${{ secrets.PROJECT_NAME }}
        CERT_ARN: ${{ steps.tf.outputs.cert }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: ${{ github.ref_name }}
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    - build_push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
      ARGOCD_HOSTNAME: argocd.shopfast.royalbengal.xyz
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.31.0
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.2
    - name: Install python dependencies for bootstrap
      run: python3 -m pip install --quiet bcrypt
    - name: Check out the branch tip so the GitOps commit is present
      run: '# build_push committed the desired state (image tag + certificate ARN)

        # to the branch. The default checkout pinned this job to the ORIGINAL

        # SHA, so without this fetch the bootstrap would read a stale values

        # file and its ARN precondition check would report a false warning.

        # The monitoring child carries Grafana''s ingress certificate ARN and

        # is rewritten by the same commit, so it must be refreshed too.

        git fetch origin "${BRANCH}"

        git checkout "origin/${BRANCH}" -- gitops/applications/shopfast/values.yaml

        git checkout "origin/${BRANCH}" -- gitops/apps/children/monitoring.yaml

        echo "Desired state refreshed from origin/${BRANCH}."

        '
      env:
        BRANCH: ${{ github.ref_name }}
    - id: tf
      name: Read cluster identity from terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw eks_cluster_name)\" >> \"$GITHUB_OUTPUT\"\
        \necho \"cert=$(terraform output -raw acm_certificate_arn)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster
        }}"
    - name: Bootstrap platform (ALB controller, Argo CD, App-of-Apps)
      run: bash gitops/bootstrap/bootstrap.sh
      env:
        CERT_ARN: ${{ steps.tf.outputs.cert }}
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      GRAFANA_HOSTNAME: grafana.shopfast.royalbengal.xyz
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.31.0
    - id: tf
      name: Read cluster identity and current certificate from terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\naws eks\
        \ update-kubeconfig --region us-east-1 \\\n  --name \"$(terraform output -raw\
        \ eks_cluster_name)\"\necho \"cert=$(terraform output -raw acm_certificate_arn)\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
      working-directory: infra
    - name: Verify real AWS / EKS / Argo CD state
      run: bash gitops/bootstrap/verify.sh
    - name: Retire superseded ACM certificates
      run: "# Runs LAST, after verify.sh has confirmed the platform is healthy and\n\
        # after configure moved the ALB listeners onto the current certificate.\n\
        # Only deletes certificates tagged for this project whose InUseBy list\n#\
        \ is EMPTY \u2014 anything still attached is skipped, never forced. This is\n\
        # what replaces the in-apply destroy that deadlocked provision.\nbash scripts/prune-retired-certs.sh\
        \ \"$PROJECT\" \"$CURRENT_CERT_ARN\"\n"
      env:
        CURRENT_CERT_ARN: ${{ steps.tf.outputs.cert }}
        PROJECT: ${{ secrets.PROJECT_NAME }}
