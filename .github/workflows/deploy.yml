    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.2
    - name: Install python dependencies for bootstrap
      run: python3 -m pip install --quiet bcrypt
    - name: Check out the branch tip so the GitOps commit is present
      run: '# build_push committed the desired state (image tag + certificate ARN)

        # to the branch. The default checkout pinned this job to the ORIGINAL

        # SHA, so without this fetch the bootstrap would read a stale values

        # file and its ARN precondition check would report a false warning.

        # The monitoring child carries Grafana''s ingress certificate ARN and

        # is rewritten by the same commit, so it must be refreshed too.

        git fetch origin "${BRANCH}"

        git checkout "origin/${BRANCH}" -- gitops/applications/shopfast/values.yaml

        git checkout "origin/${BRANCH}" -- gitops/apps/children/monitoring.yaml

        echo "Desired state refreshed from origin/${BRANCH}."

        '
      env:
        BRANCH: ${{ github.ref_name }}
    - id: tf
