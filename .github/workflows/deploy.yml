      working-directory: infra
    - name: Verify real AWS / EKS / Argo CD state
      run: bash gitops/bootstrap/verify.sh
    - name: Retire superseded ACM certificates
      run: "# Runs LAST, after verify.sh has confirmed the platform is healthy and\n\
        # after configure moved the ALB listeners onto the current certificate.\n\
        # Only deletes certificates tagged for this project whose InUseBy list\n#\
        \ is EMPTY \u2014 anything still attached is skipped, never forced. This is\n\
        # what replaces the in-apply destroy that deadlocked provision.\nbash scripts/prune-retired-certs.sh\
        \ \"$PROJECT\" \"$CURRENT_CERT_ARN\"\n"
      env:
        CURRENT_CERT_ARN: ${{ steps.tf.outputs.cert }}
        PROJECT: ${{ secrets.PROJECT_NAME }}
