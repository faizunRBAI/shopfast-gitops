name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Validate and compile
      run: mvn -B -ntp clean compile
      working-directory: application
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Unit tests
      run: mvn -B -ntp test
      working-directory: application
    - name: Package jar
      run: mvn -B -ntp -DskipTests package
      working-directory: application
  security:
    runs-on: ubuntu-latest
    needs:
    - test
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.2
    - name: "Helm chart lint \u2014 every strategy must render"
      run: "set -e\nfor s in standard bluegreen canary; do\n  echo \"::group::helm\
        \ lint strategy=$s\"\n  helm lint application/helm/shopfast \\\n    --set\
        \ strategy=$s \\\n    --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/shopfast\
        \ \\\n    --set image.tag=abc1234\n  echo \"::endgroup::\"\ndone\n"
    - name: Verify Blue/Green and Canary never render a Deployment
      run: bash scripts/verify-chart-exclusivity.sh
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: OWASP dependency vulnerability scan
      run: bash scripts/dependency-scan.sh
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  provision:
    runs-on: ubuntu-latest
    needs:
    - security
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: royalbengal.xyz
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform validate
      run: terraform validate
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -auto-approve
      working-directory: infra
    - name: "Route 53 nameservers \u2014 ACTION REQUIRED at your registrar"
      run: 'echo "::group::Set these nameservers on royalbengal.xyz (see docs/DNS-CPANEL.md)"

        terraform output -json route53_nameservers

        echo "::endgroup::"

        echo "::group::ACM validation records (only if you keep DNS on cPanel)"

        terraform output -json acm_validation_records

        echo "::endgroup::"

        '
      working-directory: infra
  build_push:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Build jar
      run: mvn -B -ntp -DskipTests package
      working-directory: application
    - id: img
      name: Resolve ECR registry and immutable tag
      run: 'ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

        echo "registry=${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com" >> "$GITHUB_OUTPUT"

        echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

        '
    - name: Login to ECR
      run: "aws ecr get-login-password --region us-east-1 \\\n  | docker login --username\
        \ AWS --password-stdin \"${{ steps.img.outputs.registry }}\"\n"
    - name: Build and push image with immutable Git SHA tag
      run: "IMAGE=\"${REGISTRY}/${REPO_NAME}-shopfast:${TAG}\"\n# ECR tags are IMMUTABLE:\
        \ a re-run on the same SHA must not fail the build.\nif aws ecr describe-images\
        \ --repository-name \"${REPO_NAME}-shopfast\" \\\n     --image-ids imageTag=\"\
        ${TAG}\" >/dev/null 2>&1; then\n  echo \"Image already exists for this commit\
        \ (immutable tag) \u2014 skipping push\"\nelse\n  docker build -t \"$IMAGE\"\
        \ .\n  docker push \"$IMAGE\"\n  echo \"Pushed image for commit ${TAG}\"\n\
        fi\n"
      working-directory: application
      env:
        REGISTRY: ${{ steps.img.outputs.registry }}
        TAG: ${{ steps.img.outputs.sha }}
        REPO_NAME: ${{ secrets.PROJECT_NAME }}
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ steps.img.outputs.registry }}/${{ secrets.PROJECT_NAME }}-shopfast:${{
          steps.img.outputs.sha }}
        format: table
        exit-code: '0'
        severity: HIGH,CRITICAL
    - name: "GitOps update \u2014 commit the new image tag"
      run: "python3 scripts/set-image.py \\\n  --values gitops/applications/shopfast/values.yaml\
        \ \\\n  --repository \"${REGISTRY}/${REPO_NAME}-shopfast\" \\\n  --tag \"\
        ${TAG}\"\ngit config user.name \"github-actions[bot]\"\ngit config user.email\
        \ \"github-actions[bot]@users.noreply.github.com\"\ngit add gitops/applications/shopfast/values.yaml\n\
        if git diff --cached --quiet; then\n  echo \"GitOps values already at this\
        \ revision \u2014 nothing to commit\"\nelse\n  git commit -m \"ci: deploy\
        \ shopfast ${TAG}\"\n  git push origin \"HEAD:${{ github.ref_name }}\"\nfi\n"
      env:
        REGISTRY: ${{ steps.img.outputs.registry }}
        TAG: ${{ steps.img.outputs.sha }}
        REPO_NAME: ${{ secrets.PROJECT_NAME }}
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    - build_push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
      GITOPS_REPO_URL: ${{ secrets.GITOPS_REPO_URL }}
      ARGOCD_HOSTNAME: argocd.shopfast.royalbengal.xyz
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.31.0
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.2
    - name: Install python dependencies for bootstrap
      run: python3 -m pip install --quiet bcrypt PyYAML
    - id: tf
      name: Read cluster identity from terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw eks_cluster_name)\" >> \"$GITHUB_OUTPUT\"\
        \necho \"cert=$(terraform output -raw acm_certificate_arn)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster
        }}"
    - name: Bootstrap platform (ALB controller, Argo CD, App-of-Apps)
      run: bash gitops/bootstrap/bootstrap.sh
      env:
        CERT_ARN: ${{ steps.tf.outputs.cert }}
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.31.0
    - name: Update kubeconfig
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\naws eks\
        \ update-kubeconfig --region us-east-1 \\\n  --name \"$(terraform output -raw\
        \ eks_cluster_name)\"\n"
      working-directory: infra
    - name: Verify real AWS / EKS / Argo CD state
      run: bash gitops/bootstrap/verify.sh
