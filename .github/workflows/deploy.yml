      run: 'ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

        echo "registry=${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com" >> "$GITHUB_OUTPUT"

        echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

        '
    - id: tf
