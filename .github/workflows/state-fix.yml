name: state-fix
'on':
  workflow_dispatch: {}
jobs:
  drop_certificate_from_state:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: royalbengal.xyz
      TF_VAR_argocd_hostname: argocd.shopfast.royalbengal.xyz
      TF_VAR_app_hostname: shopfast.royalbengal.xyz
      TF_VAR_grafana_hostname: grafana.shopfast.royalbengal.xyz
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Drop the platform certificate from terraform state
      run: "# ONE-SHOT MANUAL REPAIR \u2014 dispatch-only, NEVER in the deploy path.\n\
        #\n# Removes the STATE ENTRY aws_acm_certificate.platform. Nothing is\n# deleted\
        \ in AWS: both certificates stay in ACM and the ALB keeps\n# serving traffic\
        \ while this runs.\n#\n# WHY: infra/dns.tf carried ignore_changes on the SAN\
        \ list, so the\n# SAN list was read at CREATE time only and terraform would\
        \ never\n# replace the certificate. State was pinned to the OLD 2-SAN cert\n\
        # (argocd + apex, no grafana) permanently. That ignore_changes is\n# removed\
        \ in this same commit; dropping the resource from state is\n# what lets the\
        \ next apply CREATE a 3-SAN certificate.\n#\n# The address is LITERAL and\
        \ the script does no discovery. Two\n# earlier repair scripts tried to FIND\
        \ their target with\n# `terraform state list` / `show -json` and got it wrong\
        \ \u2014 state\n# list cannot see deposed objects at all. Removing the address\n\
        # takes the current object AND the deposed 19b0aa2c leftover.\n#\n# Idempotent:\
        \ a second run finds nothing and exits 0.\nbash scripts/state-drop-certificate.sh\n"
