apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-shopfast-application
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "ShopFast"
data:
  shopfast-application.json: |
    {
      "title": "ShopFast — Application (Spring Boot)",
      "uid": "shopfast-app",
      "tags": ["shopfast", "spring-boot"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Up pods",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "targets": [
            { "expr": "count(up{application=\"shopfast\"} == 1)", "refId": "A" }
          ]
        },
        {
          "type": "stat",
          "title": "Request rate (req/s)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 5, "x": 4, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{application=\"shopfast\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "type": "stat",
          "title": "Error rate (5xx %)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 5, "x": 9, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_server_requests_seconds_count{application=\"shopfast\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{application=\"shopfast\"}[5m])), 0.001)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "p95 latency",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 5, "x": 14, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"shopfast\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Hello requests total",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 5, "x": 19, "y": 0 },
          "targets": [
            { "expr": "sum(shopfast_hello_requests_total)", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request rate by URI",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"shopfast\"}[5m])) by (uri)",
              "legendFormat": "{{uri}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{application=\"shopfast\"}[5m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"shopfast\"}[5m])) by (le))", "legendFormat": "p95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{application=\"shopfast\"}[5m])) by (le))", "legendFormat": "p99", "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "title": "JVM heap used",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{application=\"shopfast\",area=\"heap\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GC pause rate",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 12 },
          "targets": [
            {
              "expr": "sum(rate(jvm_gc_pause_seconds_sum{application=\"shopfast\"}[5m])) by (action)",
              "legendFormat": "{{action}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Live threads",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 12 },
          "targets": [
            {
              "expr": "sum(jvm_threads_live_threads{application=\"shopfast\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
