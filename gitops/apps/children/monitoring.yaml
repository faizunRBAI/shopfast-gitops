# Observability stack, managed entirely through GitOps.
#
# victoria-metrics-k8s-stack bundles:
#   - VictoriaMetrics operator + vmsingle (Prometheus-compatible TSDB)
#   - vmagent (scraping), kube-state-metrics, node-exporter
#   - Grafana with provisioned datasource
# It replaces kube-prometheus-stack while keeping the Prometheus query API, so
# Argo Rollouts AnalysisTemplates and standard dashboards work unchanged.
#
# MULTI-SOURCE (refactored 2026-09-07)
#   Source 1 is the upstream chart, pinned to 0.35.4.
#   Source 2 is THIS repository, referenced as `$values`, supplying
#   gitops/monitoring/values.yaml.
#
#   The values used to be a ~150-line inline block right here. Moving them out
#   is not cosmetic: the Grafana ACM certificate ARN lives in those values and
#   is rewritten by scripts/set-grafana-cert.py. While it lived inside this
#   Application manifest, that script had to edit an object the root
#   App-of-Apps also reconciles, and the guard protecting the value could
#   deadlock the build that would heal it — attempt 24, where a stale ARN
#   failed the `security` stage and thereby prevented build_push, the only
#   thing that rewrites the ARN, from ever running. A plain values file has no
#   such coupling.
#
#   The chart version and every value are UNCHANGED by the move, so the first
#   sync after this refactor should report no object-level differences.
#
# SINGLE WRITER: the root App-of-Apps reconciles this file from git. Nothing
# may be patched onto this Application at bootstrap time; root would revert it
# on the next sync and the Application would never leave OutOfSync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Before shopfast (wave 20) so VMServiceScrape CRD exists when the app syncs.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    # 1. The chart itself, from the upstream Helm repository.
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.35.4
      helm:
        releaseName: vm
        # $values resolves to the source below whose `ref` is `values`.
        # The path is relative to that repository's ROOT.
        valueFiles:
          - $values/gitops/monitoring/values.yaml
    # 2. This repository, contributing values only. A source carrying `ref` and
    #    no `path` supplies files to other sources and renders nothing itself.
    - repoURL: https://github.com/faizunRBAI/shopfast-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply is the field-ownership mechanism: Argo patches only the
      # fields IT manages and leaves controller-written fields alone. That is
      # what makes a chart with PersistentVolumeClaims syncable at all.
      #
      # Replace=true WAS SET HERE AND WAS REMOVED (2026-09-07). It makes Argo
      # use `kubectl replace`, which posts the WHOLE object as the chart renders
      # it and discards field ownership entirely. The Grafana PVC template
      # declares neither volumeName nor storageClassName (it relies on the
      # default gp3 class), but the binding controller writes both when the
      # volume binds. Every sync therefore sent:
      #     volumeName: "" , storageClassName: nil
      # against a Bound claim, and the API server rejected it:
      #     PersistentVolumeClaim "vm-grafana" is invalid: spec: Forbidden:
      #     spec is immutable after creation except resources.requests ...
      # 5 retries, ~25 minutes, failed forever. Nothing was broken in the
      # cluster — Grafana kept running on the bound volume — but the app could
      # never complete a sync, so it could not deliver any FUTURE change
      # (notably the certificate ARN rewritten by scripts/set-grafana-cert.py).
      #
      # DO NOT REINTRODUCE Replace=true on this Application. Any chart that
      # provisions a PVC is fundamentally incompatible with it. If a specific
      # immutable object ever genuinely needs replacing, scope it to that one
      # resource with the argocd.argoproj.io/sync-options: Replace=true
      # annotation — never to the whole Application.
      #
      # argo-rollouts DOES set Replace=true and that is correct: it installs
      # large CRDs and provisions no PVC at all.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: operator.victoriametrics.com
      kind: VMSingle
      jsonPointers:
        - /spec/replicaCount
