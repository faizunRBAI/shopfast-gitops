# ShopFast application.
#
# Chart lives in application/helm/shopfast; the DEPLOYED values live in
# gitops/applications/shopfast/values.yaml and are rewritten by CI with the
# immutable Git SHA image tag and the ACM certificate ARN. Both come from the
# same monorepo, so a single `source` with an explicit valueFiles path is
# enough (no multi-source needed).
#
# repoURL IS COMMITTED LITERALLY — never a placeholder substituted at apply
# time. The root App-of-Apps reconciles this file FROM GIT, so any value
# injected into the live object by the bootstrap script is reverted on the next
# sync: the Application then points at a URL that does not resolve and reports
# "repository not found" with its workload never created.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopfast
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Sync after platform components (Rollouts + monitoring CRDs) exist.
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/faizunRBAI/shopfast-gitops.git
    targetRevision: main
    path: application/helm/shopfast
    helm:
      # Path is relative to the repository root.
      valueFiles:
        - ../../../gitops/applications/shopfast/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shopfast
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # Argo Rollouts owns the replica count during a progressive rollout.
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
