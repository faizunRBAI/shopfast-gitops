# Metrics Services + scrapes for the GitOps control plane itself: the Argo CD
# components and the Argo Rollouts controller.
#
# Without these, the platform can tell you the health of the APPLICATION while
# being completely blind to the health of the machinery that deploys it — sync
# failures, repo-server errors, stalled rollouts.
#
# The manifests target TWO namespaces (argocd and argo-rollouts), and each
# object carries its own metadata.namespace. destination.namespace below is only
# the default for objects that omit one; it is not a restriction.
#
# repoURL is committed literally — see the note in shopfast.yaml. A placeholder
# substituted at apply time is reverted by the root App-of-Apps on its next
# sync, leaving this Application unable to resolve its own source.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-controllers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After the monitoring stack (wave 10) — the VMServiceScrape CRD must exist
    # before these manifests can be applied.
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: default
  source:
    repoURL: https://github.com/faizunRBAI/shopfast-gitops.git
    targetRevision: main
    path: gitops/observability-controllers
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No CreateNamespace: both namespaces are created by earlier waves, and
    # this Application should not own their lifecycle.
    syncOptions: []
