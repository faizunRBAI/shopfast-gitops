# ---------------------------------------------------------------------------
# APP-OF-APPS ROOT
#
# This is the ONLY Application applied by the bootstrap script. It watches
# gitops/apps/children/ and creates every other Application from git, so after
# bootstrap the cluster's entire desired state is defined by this repository.
#
# repoURL is committed literally, exactly as in the children. The root is the
# one object nothing else reconciles, so a placeholder here would "work" — but
# keeping every Application consistent means there is a single, obvious place
# to change if the repository ever moves, and no apply-time substitution step
# that can silently disagree with git.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/faizunRBAI/shopfast-gitops.git
    targetRevision: main
    path: gitops/apps/children
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
