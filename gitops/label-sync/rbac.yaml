# Least-privilege identity for the label-sync CronJob.
#
# A Role + RoleBinding, NOT a ClusterRole: the job only ever touches workloads
# in the shopfast namespace, so it gets no cluster-wide read of any kind.
# Verbs are limited to reading the workload and patching its labels — no
# create, no delete, no access to Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: label-sync
  namespace: shopfast
  labels:
    app.kubernetes.io/name: label-sync
    app.kubernetes.io/part-of: shopfast-platform
# The job authenticates with its projected token; it calls only the API server.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: label-sync
  namespace: shopfast
  labels:
    app.kubernetes.io/name: label-sync
    app.kubernetes.io/part-of: shopfast-platform
rules:
  # Rollouts: the workload object under bluegreen/canary.
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "patch"]
  # Deployments: the workload object under strategy=standard.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: label-sync
  namespace: shopfast
  labels:
    app.kubernetes.io/name: label-sync
    app.kubernetes.io/part-of: shopfast-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: label-sync
subjects:
  - kind: ServiceAccount
    name: label-sync
    namespace: shopfast
