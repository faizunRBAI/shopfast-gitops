# ---------------------------------------------------------------------------
# LABEL SYNC — keeps the Argo CD console's version label honest.
#
# WHY THIS EXISTS
#   Helm renders app.kubernetes.io/version from .Chart.AppVersion, which is a
#   constant in Chart.yaml. The image tag, meanwhile, is rewritten by CI on
#   every build. So the console reports:
#       app.kubernetes.io/version: 1.0.0     while pods run :5274b56
#   This job copies the real tag off the running container onto the label.
#
# IMAGE CHOICE — AND WHY IT IS A DIGEST
#   bitnami/kubectl ships a shell AND kubectl. A distroless kubectl image
#   cannot run this script at all: there is no /bin/sh to interpret it.
#
#   It is pinned BY DIGEST because Bitnami no longer publishes versioned tags
#   on the free Docker Hub tier. Verified against this cluster's own runtime:
#       bitnami/kubectl:1.31.3 -> NotFound
#       bitnami/kubectl:1.37.0 -> NotFound
#       bitnami/kubectl:latest -> pulls, reports Client Version v1.37.0
#   So `latest` is the ONLY tag that resolves — and depending on a floating
#   tag for a job that runs 1440 times a day is how this breaks silently later.
#
#   THE DIGEST BELOW WAS READ FROM AN ACTUAL SUCCESSFUL PULL in this cluster
#   (.status.containerStatuses[0].imageID of a probe pod), never written from
#   memory. A fabricated sha256 is ImagePullBackOff forever and looks MORE
#   rigorous than a tag, so it attracts less review.
#
#   TO REFRESH IT: pull bitnami/kubectl:latest and read back the imageID.
#   imagePullPolicy is IfNotPresent because a digest is already immutable —
#   Always would re-hit the registry every minute for no benefit.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: label-sync
  namespace: shopfast
  labels:
    app.kubernetes.io/name: label-sync
    app.kubernetes.io/part-of: shopfast-platform
spec:
  schedule: "* * * * *"
  # Never let a slow run pile up behind the previous one.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: label-sync
        spec:
          serviceAccountName: label-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: label-sync
              image: docker.io/bitnami/kubectl@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  NS=shopfast
                  NAME=shopfast

                  # Find the workload. Exactly one of these exists: a Rollout
                  # under bluegreen/canary, a Deployment under standard.
                  KIND=""
                  if kubectl -n "$NS" get rollout "$NAME" >/dev/null 2>&1; then
                    KIND=rollout
                  elif kubectl -n "$NS" get deployment "$NAME" >/dev/null 2>&1; then
                    KIND=deployment
                  fi

                  if [ -z "$KIND" ]; then
                    echo "no rollout or deployment named $NAME in $NS; nothing to do"
                    exit 0
                  fi

                  IMAGE=$(kubectl -n "$NS" get "$KIND" "$NAME" \
                    -o jsonpath='{.spec.template.spec.containers[0].image}')

                  # Guard against a digest-pinned app image (repo@sha256:...),
                  # which has no tag to publish.
                  case "$IMAGE" in
                    *@sha256:*)
                      echo "image is digest-pinned ($IMAGE); no tag to sync"
                      exit 0
                      ;;
                  esac

                  TAG=${IMAGE##*:}

                  if [ -z "$TAG" ] || [ "$TAG" = "$IMAGE" ]; then
                    echo "could not parse a tag from '$IMAGE'; leaving label alone"
                    exit 0
                  fi

                  CURRENT=$(kubectl -n "$NS" get "$KIND" "$NAME" \
                    -o jsonpath='{.metadata.labels.app\.kubernetes\.io/version}')

                  if [ "$CURRENT" = "$TAG" ]; then
                    echo "label already correct ($TAG); no patch needed"
                    exit 0
                  fi

                  echo "patching $KIND/$NAME version label: '$CURRENT' -> '$TAG'"
                  kubectl -n "$NS" patch "$KIND" "$NAME" --type=merge \
                    -p "{\"metadata\":{\"labels\":{\"app.kubernetes.io/version\":\"$TAG\"}}}"
