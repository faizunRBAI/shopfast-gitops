# ---------------------------------------------------------------------------
# DEPLOYED STATE — this file is the GitOps source of truth for ShopFast.
#
# *** THIS FILE IS OWNED BY CI. EDIT IT WITH EXTREME CARE. ***
#   The `image` and `ingress.certificateArn` lines below are REWRITTEN BY CI
#   (build_push stage) on every successful build, and CI commits the change
#   back to this repo. Argo CD then observes the new desired state and drives
#   the rollout. CI never talks to the cluster — changing this file is the ONLY
#   way a new version reaches production.
#
#   CONSEQUENCE, learned the hard way on 2026-09-08: rewriting this file
#   wholesale from a stale local copy REVERTS the deployed image tag to the
#   bootstrap placeholder. The pods then fail with
#       InvalidImageName: couldn't parse image name
#       "PLACEHOLDER_REGISTRY/shopfast:bootstrap"
#   the ReplicaSet goes to zero ready replicas, and the site returns 503.
#   When editing an unrelated key here, change ONLY that key — never
#   regenerate the whole file from memory or from an older revision.
#
# SINGLE WRITER: every environment-specific value the chart needs lives HERE.
# Nothing may be injected into the shopfast Application object at bootstrap
# time — the root App-of-Apps reconciles that Application from git, so an
# apply-time patch becomes a second writer, root reverts it, and the app never
# leaves OutOfSync.
#
# To switch delivery strategy, edit `strategy` and commit:
#   standard  -> plain Kubernetes Deployment
#   bluegreen -> Argo Rollout, manual promotion of the new colour
#   canary    -> Argo Rollout, weighted progressive traffic shift
# ---------------------------------------------------------------------------

strategy: bluegreen

replicaCount: 3

image:
  # WRITTEN BY CI (scripts/gitops-commit.sh). Do not hand-edit these two lines.
  repository: 241533126054.dkr.ecr.us-east-1.amazonaws.com/shopfast-gitops-shopfast
  tag: "37e79d0"
  # Always, matching the chart default. Tags here are unique Git SHAs so this
  # normally changes nothing — it only matters when a tag is reused or moved,
  # where IfNotPresent would serve cached layers while reporting the new tag.
  # See the chart's values.yaml for the full rationale.
  pullPolicy: Always

release:
  color: blue

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  host: shopfast.royalbengal.xyz
  # WRITTEN BY CI from the ACM certificate ARN in terraform state. Must stay in
  # lockstep with the Grafana copy in gitops/monitoring/values.yaml —
  # verify-gitops-manifests.sh check 5 fails the build if they diverge.
  #
  # REPOINTED 2026-09-08 (a305f33d -> faa631c6). The fix-21 rotation replaced
  # the 2-SAN certificate with the 3-SAN one, but only two of the three
  # hostnames followed. Read live before this edit:
  #     argocd-server -> faa631c6
  #     vm-grafana    -> faa631c6
  #     shopfast      -> a305f33d   <- stale
  # Nothing appeared broken because all three Ingresses share ALB group
  # shopfast-platform: the listener carried BOTH certificates and SNI picked
  # the right one per host. The danger is scripts/prune-retired-certs.sh, which
  # deletes certificates the listeners have moved off — this stale reference
  # was the only thing keeping the retired cert alive, and its deletion would
  # have taken HTTPS down for this hostname alone.
  certificateArn: "arn:aws:acm:us-east-1:241533126054:certificate/faa631c6-ce37-4718-8421-9389eddf9f01"

blueGreen:
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 30
  prePromotionAnalysis: false

canary:
  analysis: false
  steps:
    - setWeight: 20
    - pause: { duration: 60s }
    - setWeight: 50
    - pause: { duration: 120s }
    - setWeight: 80
    - pause: { duration: 60s }

metrics:
  serviceScrape:
    enabled: true
