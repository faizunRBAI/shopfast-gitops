# ---------------------------------------------------------------------------
# DEPLOYED STATE — this file is the GitOps source of truth for ShopFast.
#
# The `image` and `ingress.certificateArn` lines below are REWRITTEN BY CI
# (build_push stage) on every successful build. CI commits the change back to
# this repo; Argo CD then observes the new desired state and drives the rollout.
#
# CI never talks to the cluster. Changing this file is the only way a new
# version reaches production.
#
# SINGLE WRITER: every environment-specific value the chart needs lives HERE.
# Nothing may be injected into the shopfast Application object at bootstrap
# time — the root App-of-Apps reconciles that Application from git, so an
# apply-time patch becomes a second writer, root reverts it, and the app never
# leaves OutOfSync.
#
# To switch delivery strategy, edit `strategy` and commit:
#   standard  -> plain Kubernetes Deployment
#   bluegreen -> Argo Rollout, manual promotion of the new colour
#   canary    -> Argo Rollout, weighted progressive traffic shift
# ---------------------------------------------------------------------------

strategy: bluegreen

replicaCount: 3

image:
  repository: PLACEHOLDER_REGISTRY/shopfast
  tag: "bootstrap"
  # Always, matching the chart default. Tags here are unique Git SHAs so this
  # normally changes nothing — it only matters when a tag is reused or moved,
  # where IfNotPresent would serve cached layers while reporting the new tag.
  # See the chart's values.yaml for the full rationale.
  pullPolicy: Always

release:
  color: blue

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  host: shopfast.royalbengal.xyz
  # Written by CI from the ACM certificate ARN in terraform state, then
  # committed. Empty until the first build_push runs against a provisioned
  # certificate; the ALB then serves this host over HTTPS.
  certificateArn: "arn:aws:acm:us-east-1:241533126054:certificate/a305f33d-4f7c-46c6-afe1-cd4fc4ea46ac"

blueGreen:
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 30
  prePromotionAnalysis: false

canary:
  analysis: false
  steps:
    - setWeight: 20
    - pause: { duration: 60s }
    - setWeight: 50
    - pause: { duration: 120s }
    - setWeight: 80
    - pause: { duration: 60s }

metrics:
  serviceScrape:
    enabled: true
